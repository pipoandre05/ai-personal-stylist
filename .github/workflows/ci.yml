name: ci
on:
  pull_request:
    paths: ['web/**', '.github/workflows/ci.yml']
  push:
    branches: [main]
    paths: ['web/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run verify
        working-directory: web
